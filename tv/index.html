<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kitchen Calendar</title>
  <link rel="icon" href="../icon.png">
  <style>
    :root {
      --bg: #f6f5f1; --card: #ffffff; --ink: #14213d; --muted: #6b7280; --line: #e5e2da;
      --soft: #efece4; --accent: #e63946; --now: #fde8ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Amazon Ember", sans-serif;
      /* Everything scales with the screen so it reads the same on the Echo Show 8 (1280×800) and bigger screens */
      font-size: clamp(12px, min(1.55vw, 2.5vh), 30px);
      color-scheme: light;
    }
    :root.night {
      --bg: #0b1020; --card: #151c2e; --ink: #eef1f7; --muted: #9aa3b5; --line: #263049;
      --soft: #1c2438; --now: #3a1f2a; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { cursor: default; user-select: none; -webkit-user-select: none; }
    .center { height: 100%; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .muted { color: var(--muted); }

    #screen { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 1.4rem 1.8rem 0.8rem; gap: 1.1rem; }

    header { display: flex; align-items: flex-end; gap: 1.6rem; }
    .clock { font-size: 4.6rem; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; font-variant-numeric: tabular-nums; }
    .clock small { font-size: 1.6rem; font-weight: 700; letter-spacing: 0; margin-left: 0.3rem; color: var(--muted); }
    .date { font-size: 1.9rem; font-weight: 700; line-height: 1.1; padding-bottom: 0.25rem; }
    .date span { display: block; font-size: 1.05rem; font-weight: 600; color: var(--muted); margin-top: 0.25rem; }
    .nextup { margin-left: auto; text-align: right; max-width: 42%; padding-bottom: 0.25rem; }
    .nextup .lbl { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 800; }
    .nextup .what { font-size: 1.35rem; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nextup .when { font-size: 1.05rem; color: var(--muted); font-weight: 600; }

    .cols { display: grid; grid-template-columns: 1.12fr 1fr; gap: 1.4rem; min-height: 0; }
    .col { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .col > h2 { margin: 0 0 0.6rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
    .col > h2 b { color: var(--accent); }
    .list { min-height: 0; overflow: hidden; flex: 1; }

    .banner { display: inline-block; background: var(--soft); border-radius: 999px; padding: 0.3rem 0.9rem; font-weight: 700; font-size: 1rem; margin: 0 0.4rem 0.6rem 0; }

    .ev { display: flex; gap: 0.9rem; background: var(--card); border: 1px solid var(--line); border-radius: 0.9rem; padding: 0.75rem 0.95rem; margin-bottom: 0.6rem; align-items: stretch; }
    .ev .bar { width: 0.42rem; border-radius: 0.3rem; flex: none; }
    .ev .t { width: 5.4rem; flex: none; font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .ev .t small { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .ev .b { min-width: 0; flex: 1; }
    .ev .title { font-size: 1.35rem; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .ev .meta { margin-top: 0.25rem; font-size: 1rem; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev .ride { margin-top: 0.2rem; font-size: 1rem; font-weight: 700; }
    .ev.done { opacity: 0.42; }
    .pair { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; }
    .pair .card { background: var(--card); color: var(--ink); border-radius: 1.2rem; padding: 2rem 2.4rem; max-width: 38rem; text-align: center; }
    .pair h1 { margin: 0 0 .6rem; font-size: 2rem; }
    .pair p { font-size: 1.15rem; line-height: 1.4; }
    .pair .code { font-size: 4.4rem; font-weight: 800; letter-spacing: .12em; margin: 1rem 0; font-variant-numeric: tabular-nums; }
    .pair a { color: var(--muted); font-size: 1rem; }
    footer .signin { color: var(--accent); font-weight: 800; text-decoration: none; }
    .list.dense .ev { padding: 0.45rem 0.85rem; margin-bottom: 0.4rem; }
    .list.dense .ev .title { font-size: 1.15rem; -webkit-line-clamp: 1; }
    .list.dense .ev .t { font-size: 1.05rem; }
    .ev.now { background: var(--now); border-color: var(--accent); }
    .tag { display: inline-block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: #fff; border-radius: 0.3rem; padding: 0.08rem 0.4rem; vertical-align: 0.2em; margin-right: 0.35rem; }
    .tag.soft { background: var(--soft); color: var(--muted); }
    .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 0.9rem; padding: 1.6rem; text-align: center; color: var(--muted); font-size: 1.3rem; font-weight: 600; }

    /* "Coming up" column: compact rows grouped by day */
    .day { margin-bottom: 0.7rem; }
    .day h3 { margin: 0 0 0.35rem; font-size: 1.05rem; font-weight: 800; display: flex; gap: 0.5rem; align-items: baseline; }
    .day h3 span { color: var(--muted); font-weight: 600; font-size: 0.95rem; }
    .row { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.32rem 0 0.32rem 0.6rem; border-left: 0.32rem solid var(--c, var(--muted)); margin-bottom: 0.25rem; background: var(--card); border-radius: 0 0.5rem 0.5rem 0; }
    .row .t { width: 4.6rem; flex: none; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
    .row .title { font-weight: 700; font-size: 1.08rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding-right: 0.5rem; }
    .row .title small { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
    .more { color: var(--muted); font-weight: 700; font-size: 0.95rem; padding: 0.2rem 0 0 0.9rem; }

    footer { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--muted); align-items: center; }
    footer a { color: inherit; }
    footer .sp { flex: 1; }
    .off { color: var(--accent); font-weight: 700; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 2rem 2.2rem; max-width: 34rem; width: 100%; }
    .card h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    .card p { font-size: 1.1rem; }
    .in { width: 100%; font: inherit; font-size: 1.4rem; padding: 0.7rem 0.9rem; border-radius: 0.6rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 0.6rem 0 1rem; }
    .btn { font: inherit; font-size: 1.2rem; font-weight: 700; border: 0; border-radius: 999px; padding: 0.7rem 1.6rem; background: var(--accent); color: #fff; cursor: pointer; }
    .bad { color: var(--accent); font-weight: 700; }

    /* Chores & groceries column (wide screens, only when there's something on the lists) */
    .withlists .cols { grid-template-columns: 1.05fr 1fr 0.72fr; }
    .lists .list { flex: 0 1 auto; margin-bottom: 0.9rem; }
    .item { display: flex; gap: 0.6rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 0.6rem; padding: 0.45rem 0.65rem; margin-bottom: 0.35rem; cursor: pointer; }
    .item .box { flex: none; width: 1.4rem; height: 1.4rem; border-radius: 50%; border: 0.15rem solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; color: #fff; }
    .item .txt { font-size: 1.05rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .cem { width: 1.25rem; height: 1.25rem; margin-right: 0.35rem; vertical-align: -0.2rem; }
    .item.done { opacity: 0.5; }
    .item.done .box { background: var(--accent); border-color: var(--accent); }
    .item.done .txt { text-decoration: line-through; }
    .kidchores { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; border-bottom: 1px solid var(--line); }
    .kidchores .kn { flex: none; width: 3.6rem; font-weight: 800; font-size: 1.05rem; line-height: 1.1; }
    .kidchores .kn small { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); }
    .kidchores.alldone .chips { opacity: 0.45; }
    .kidchores .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chore { position: relative; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 0.7rem; cursor: pointer; }
    .chore .cem { width: 1.7rem; height: 1.7rem; margin: 0; }
    .chore.done { opacity: 0.4; }
    .chore .ck { position: absolute; right: -0.25rem; bottom: -0.25rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: #22c55e; color: #fff; font-size: 0.7rem; display: grid; place-items: center; }

    /* Narrow / portrait screens: stack the two columns */
    @media (max-aspect-ratio: 1/1) {
      :root { font-size: clamp(12px, 2.6vw, 28px); }
      .cols { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .nextup { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"><div class="center muted">Loading…</div></div>
  <script type="module" src="tv.js?v=14"></script>
</body>
</html>
